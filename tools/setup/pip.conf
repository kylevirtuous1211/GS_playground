# Repo-local pip config, selected via PIP_CONFIG_FILE in the setup scripts.
#
# Why this exists: the user-level ~/.config/pip/pip.conf (autogenerated by
# NVIDIA PyIndex) sets extra-index-url = https://pypi.ngc.nvidia.com, which no
# longer resolves. pip falls through to PyPI eventually, but only after three
# DNS retries per package -- across ~400 pinned requirements that dominates the
# build. It also sets no-cache-dir, which makes every rebuild re-download.
#
# This file is scoped to this repository; the global config is left alone.
[global]
index-url = https://pypi.org/simple
